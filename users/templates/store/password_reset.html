{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset Password — D Threads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <nav class="navbar" role="navigation">
    <div class="nav-inner">
      <a href="{% url 'users:index' %}" class="logo" aria-label="D Threads Home">D&nbsp;threads</a>
      <div class="nav-actions" style="margin-left:auto;">
        <a href="{% url 'users:login' %}" class="btn btn-ghost" style="font-size:0.78rem;padding:7px 18px;">← Back to Sign In</a>
      </div>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-orb auth-orb--cyan" aria-hidden="true"></div>
    <div class="auth-orb auth-orb--pink" aria-hidden="true"></div>

    <div class="auth-card">
      <span class="card-corner card-corner--tl" aria-hidden="true"></span>
      <span class="card-corner card-corner--tr" aria-hidden="true"></span>
      <span class="card-corner card-corner--bl" aria-hidden="true"></span>
      <span class="card-corner card-corner--br" aria-hidden="true"></span>

      <div class="auth-brand">
        <span class="auth-logo">D&nbsp;threads</span>
        <p class="auth-tagline">// RECOVER ACCESS</p>
      </div>

      <h1 class="auth-title">Reset <span class="accent-cyan">Password</span></h1>
      <p class="auth-subtitle">Enter the email linked to your account and we'll send reset instructions.</p>

      <form class="auth-form" method="post" novalidate>
        {% csrf_token %}
        <div class="auth-field">
          <label for="id_email" class="auth-label">Email Address <span class="auth-required">*</span></label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            </span>
            {{ form.email }}
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full auth-submit-btn" style="margin-top:0.4rem;">Send Reset Link</button>
      </form>

      <p class="auth-switch" style="margin-top:1.6rem;">
        Remembered it?
        <a href="{% url 'users:login' %}" class="auth-link">Sign In →</a>
      </p>
    </div>
  </main>
</body>
</html>
