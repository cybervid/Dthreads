{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Check Your Email — D Threads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <nav class="navbar" role="navigation">
    <div class="nav-inner">
      <a href="{% url 'users:index' %}" class="logo">D&nbsp;threads</a>
      <div class="nav-actions" style="margin-left:auto;">
        <a href="{% url 'users:index' %}" class="btn btn-ghost" style="font-size:0.78rem;padding:7px 18px;">← Back to Store</a>
      </div>
    </div>
  </nav>

  <main class="auth-main">
    <div class="auth-orb auth-orb--cyan" aria-hidden="true"></div>
    <div class="auth-card" style="text-align:center;">
      <span class="card-corner card-corner--tl" aria-hidden="true"></span>
      <span class="card-corner card-corner--br" aria-hidden="true"></span>

      <p style="font-size:3rem;margin-bottom:1rem;">📬</p>
      <h1 class="auth-title">Check Your <span class="accent-cyan">Email</span></h1>
      <p class="auth-subtitle" style="margin-bottom:2rem;">
        If an account exists for that address, you'll receive a reset link shortly.
        Don't forget to check your spam folder.
      </p>
      <a href="{% url 'users:login' %}" class="btn btn-primary">Back to Sign In</a>
    </div>
  </main>
</body>
</html>
